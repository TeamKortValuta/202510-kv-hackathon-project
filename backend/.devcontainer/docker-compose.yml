services:
  app:
    build:
      context: app/
      dockerfile: Dockerfile
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    platform: linux/amd64
    image: kv-rails-app
    container_name: kv-rails-app
    working_dir: /workspace/rails-app
    command: ash -c 'rm -f tmp/pids/server.pid && bundle exec rails s -b 0.0.0.0'
    tty: true
    stdin_open: true
    user: ruby
    env_file:
      - .env
    ports:
      - "3000:3000"
    volumes:
      - type: bind
        source: $PWD
        target: /workspace/rails-app
      - type: volume
        source: bundle_volume
        target: /usr/local/bundle
    depends_on:
      - db

  db:
    image: postgres:16.6
    container_name: kv-rails-app-db
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
    ports:
      - "5432:5432"
    volumes:
      - type: volume
        source: db_volume
        target: /var/lib/postgresql/data

volumes:
  db_volume:
    name: "kv-rails-app_devcontainer_db"
    driver: local
  bundle_volume:
    name: "kv-rails-app_devcontainer_bundle"
    driver: local
